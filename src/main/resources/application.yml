server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${MS_FRONTEND_URL:http://localhost:5173}"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: ms-gestion-route
          uri: ${MS_GESTION_URL:http://localhost:8081}
          predicates:
            - Path=/api/gestion/**,/api/centros-medicos/**,/api/usuarios/**,/api/reservas/**,/api/lista-espera/**
        - id: ms-notificaciones-route
          uri: ${MS_NOTIFICACIONES_URL:http://localhost:8085}
          predicates:
            - Path=/api/notificaciones/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG