server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${MS_FRONTEND_URL:http://localhost:5173}"
            allowedMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
            allowedHeaders: ["Authorization", "Content-Type", "apikey"]
            allowCredentials: true
      
      routes:
        # 1. Todo lo que empiece con /api/portal/ va directo a MS-PORTAL
        - id: ms-portal-route
          uri: ${MS_PORTAL_URL:http://localhost:8082}
          predicates:
            - Path=/api/portal/**

        # 2. Todo lo que empiece con /api/gestion/ va directo a MS-GESTION
        - id: ms-gestion-route
          uri: ${MS_GESTION_URL:http://localhost:8081}
          predicates:
            - Path=/api/gestion/**
       
        # 4. Otros servicios independientes
        - id: ms-reasignacion-route
          uri: ${MS_REASIGNACION_URL:http://localhost:8083}
          predicates:
            - Path=/api/reasignaciones/**
        
        - id: ms-notificaciones-route
          uri: ${MS_NOTIFICACIONES_URL:http://localhost:8085}
          predicates:
            - Path=/api/notificaciones/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG